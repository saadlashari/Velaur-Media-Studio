name: Guest access tests

on:
  push:
    branches:
      - feature/guest-access-manual-approval
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guest-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: python -m pip install 'fastapi==0.110.0'
      - name: Compile Python backend
        run: python -m compileall -q main.py accounts.py identity.py guest_access.py admin_tools.py
      - name: Execute isolated guest tests
        run: python -m unittest discover -s tests -v
